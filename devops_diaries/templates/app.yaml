# ==============================================================
# Devops Diaries Blog Platform - Kubernetes Manifest (Minikube)
# Includes: Namespace, Secret, PVC, PostgreSQL, Backend, Frontend, Ingress
# ============================================================== 

# Prerequisite for local access:
#   minikube addons enable ingress

# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: devops-diaries

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
type: Opaque
data:
  POSTGRES_USER: ZGV2b3BzLWRpYXJpZXMtdXNlcg==
  POSTGRES_PASSWORD: ZGV2b3BzLWRpYXJpZXMtcGFzc3dvcmQ=
  POSTGRES_DB: ZGV2b3BzLWRpYXJpZXMtZGI=

---
# ---- PersistentVolumeClaim for PostgreSQL (Minikube-friendly) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistentvolume.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistentvolume.storageClassname }}
  resources:
    requests:
      storage: {{ .Values.persistentvolume.capacity }}

---
# ---- PostgreSQL Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.db.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.db.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.db.replicacount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.db.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.db.name }}
        app.kubernetes.io/part-of: {{ .Values.namespace.name }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - containerPort: {{ .Values.db.services.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistentvolume.name }}

---
# ---- PostgreSQL Service ----
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.db.services.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.db.services.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.db.services.name }}
  ports:
    - port: {{ .Values.db.services.port }}
      targetPort: {{ .Values.db.services.targetPort }}
      protocol: TCP

---
# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.backend.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicacount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.backend.name }}
        app.kubernetes.io/part-of: {{ .Values.namespace.name }}
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for devops-diaries-db:5432..."
              until nc -z devops-diaries-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.services.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "devops-diaries-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Backend Service ----
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.services.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.backend.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: {{ .Values.backend.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.backend.name }}
  ports:
    - port: {{ .Values.backend.services.port }}
      targetPort: {{ .Values.backend.services.targetPort }}
      protocol: TCP

---
# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.frontend.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicacount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.frontend.name }}
        app.kubernetes.io/part-of: {{ .Values.namespace.name }}
        app.kubernetes.io/component: {{ .Values.frontend.name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.frontend.services.targetPort }}
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.services.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.services.targetPort }}
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service ----
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.services.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.frontend.name }}
    app.kubernetes.io/part-of: {{ .Values.namespace.name }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.frontend.name }}
  ports:
    - port: {{ .Values.frontend.services.port }}
      targetPort: {{ .Values.frontend.services.targetPort }}
      protocol: TCP

---
# ---- NetworkPolicy: Database only accepts traffic from Backend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Values.namespace.name }}-db-allow-backend-only'
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.db.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.backend.name }}
      ports:
        - port: 5432
          protocol: TCP

---
# ---- NetworkPolicy: Backend only accepts traffic from Frontend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Values.namespace.name }}-backend-allow-frontend-only'
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.backend.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.frontend.name }}
      ports:
        - port: 5000
          protocol: TCP

---
# ---- Ingress for frontend only (backend stays internal) ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: '{{ .Values.namespace.name }}-ingress'
  namespace: {{ .Values.namespace.name }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-diaries.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.services.name }}
                port:
                  number: 80
