# ==============================================================
# Devops Diaries Blog Platform - Kubernetes Manifest (Minikube)
# Includes: Namespace, Secret, PVC, PostgreSQL, Backend, Frontend, Ingress
# ============================================================== 

# Prerequisite for local access:
#   minikube addons enable ingress

# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: devops-diaries
  labels:
    app.kubernetes.io/part-of: devops-diaries

---

apiVersion: v1
kind: Secret
metadata:
  name: devops-diaries-db-secret
  namespace: devops-diaries
  labels:
    app.kubernetes.io/part-of: devops-diaries
type: Opaque
data:
  POSTGRES_USER: ZGV2b3BzLWRpYXJpZXMtdXNlcg==
  POSTGRES_PASSWORD: ZGV2b3BzLWRpYXJpZXMtcGFzc3dvcmQ=
  POSTGRES_DB: ZGV2b3BzLWRpYXJpZXMtZGI=

---
# ---- PersistentVolumeClaim for PostgreSQL (Minikube-friendly) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-diaries-db-pvc
  namespace: devops-diaries
  labels:
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# ---- PostgreSQL Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-diaries-db
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-db
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-diaries-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-diaries-db
        app.kubernetes.io/part-of: devops-diaries
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: devops-diaries-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: devops-diaries-db-pvc

---
# ---- PostgreSQL Service ----
apiVersion: v1
kind: Service
metadata:
  name: devops-diaries-db
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-db
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-diaries-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-diaries-backend
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-backend
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-diaries-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-diaries-backend
        app.kubernetes.io/part-of: devops-diaries
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for devops-diaries-db:5432..."
              until nc -z devops-diaries-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: vinay526/devops-diaries-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "devops-diaries-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-diaries-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-diaries-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: devops-diaries-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Backend Service ----
apiVersion: v1
kind: Service
metadata:
  name: devops-diaries-backend
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-backend
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-diaries-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---
# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-diaries-frontend
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-frontend
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-diaries-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-diaries-frontend
        app.kubernetes.io/part-of: devops-diaries
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: vinay526/devops-diaries-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service ----
apiVersion: v1
kind: Service
metadata:
  name: devops-diaries-frontend
  namespace: devops-diaries
  labels:
    app.kubernetes.io/name: devops-diaries-frontend
    app.kubernetes.io/part-of: devops-diaries
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-diaries-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

---
# ---- NetworkPolicy: Database only accepts traffic from Backend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-diaries-db-allow-backend-only
  namespace: devops-diaries
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-diaries-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devops-diaries-backend
      ports:
        - port: 5432
          protocol: TCP

---
# ---- NetworkPolicy: Backend only accepts traffic from Frontend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-diaries-backend-allow-frontend-only
  namespace: devops-diaries
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-diaries-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: devops-diaries-frontend
      ports:
        - port: 5000
          protocol: TCP

---
# ---- Ingress for frontend only (backend stays internal) ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-diaries-ingress
  namespace: devops-diaries
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-diaries.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-diaries-frontend
                port:
                  number: 80
