name: CI_workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-backend:${{github.run_id}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-frontend:${{github.run_id}}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: update the tags in helm chart
        run: |
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-backend:latest|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-backend:${{github.run_id}}|g" ./devops_diaries/values.yaml
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-frontend:latest|image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-diaries-frontend:${{github.run_id}}|g" ./devops_diaries/values.yaml

      - name: commit and push changes to helm chart
        run: |
          git config --global user.name "Vinay29k"
          git config --global user.email "kumarvinay23.aug@gmail.com"
          git add ./helm/devops_diaries/values.yaml
          git commit -m "Update image tags in Helm chart"
          git push origin main